<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mymath - Mathematical Tools</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 800px;
            width: 100%;
            padding: 40px;
            text-align: center;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }
        
        .tool-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            border-radius: 8px;
            color: white;
            text-decoration: none;
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }
        
        .tool-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        
        .tool-card h3 {
            margin-bottom: 10px;
            font-size: 1.3em;
        }
        
        .tool-card p {
            font-size: 0.9em;
            opacity: 0.9;
        }
        
        .footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            color: #999;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧮 Mymath</h1>
        <p class="subtitle">Mathematical Tools & Utilities</p>
        
        <div class="tools-grid">
            <div class="tool-card">
                <h3>Calculator</h3>
                <p>Basic mathematical operations</p>
            </div>
            <div class="tool-card">
                <h3>Converters</h3>
                <p>Unit and base conversions</p>
            </div>
            <div class="tool-card">
                <h3>Formulas</h3>
                <p>Common mathematical formulas</p>
            </div>
        </div>
        
        <div class="footer">
            <p>Created with ❤️ | <a href="https://github.com/chanchaidd/Mymath" style="color: #667eea;">View on GitHub</a></p>
        </div>
    </div>
</body>
</html>
